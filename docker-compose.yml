services:
  studio:
    build: .
    image: what-if-app
    init: true
    # Host networking: the local TTS/translation API (nouveau, :8005) listens on the host's 127.0.0.1,
    # so a bridge network cannot reach it. The app therefore binds 127.0.0.1 itself (never 0.0.0.0).
    # If you prefer a bridge, run uvicorn on 0.0.0.0:8005 and use extra_hosts + WHATIF_NOUVEAU_URL.
    network_mode: host
    environment:
      WHATIF_SKILL_DIR: /skill
      WHATIF_DATA: /data
      WHATIF_HOST: 127.0.0.1
      WHATIF_PORT: 3000
      WHATIF_AUTH_TOKEN: ${WHATIF_AUTH_TOKEN:-}
      WHATIF_PROVIDER: ${WHATIF_PROVIDER:-mock}
      WHATIF_BASE_URL: ${WHATIF_BASE_URL:-}
      WHATIF_MODEL: ${WHATIF_MODEL:-}
      WHATIF_API_KEY: ${WHATIF_API_KEY:-}
      WHATIF_CONTEXT_CHARS: ${WHATIF_CONTEXT_CHARS:-90000}
      # off (défaut) = l'agent va au bout sans rien demander ; pipeline|all = portes d'approbation
      WHATIF_APPROVALS: ${WHATIF_APPROVALS:-off}
      WHATIF_MAX_STEPS: ${WHATIF_MAX_STEPS:-1000}
      WHATIF_MAX_TOKENS: ${WHATIF_MAX_TOKENS:-24000}
      # the independent reviewer: a vision model is advised (see .env.example)
      WHATIF_REVIEWER_ENABLED: ${WHATIF_REVIEWER_ENABLED:-}
      WHATIF_REVIEW_PROVIDER: ${WHATIF_REVIEW_PROVIDER:-}
      WHATIF_REVIEW_BASE_URL: ${WHATIF_REVIEW_BASE_URL:-}
      WHATIF_REVIEW_MODEL: ${WHATIF_REVIEW_MODEL:-}
      WHATIF_REVIEW_API_KEY: ${WHATIF_REVIEW_API_KEY:-}
      WHATIF_REVIEW_MAX_ROUNDS: ${WHATIF_REVIEW_MAX_ROUNDS:-2}
      WHATIF_REVIEW_MAX_TOKENS: ${WHATIF_REVIEW_MAX_TOKENS:-12000}
      # the local app that owns the videos, the French narrations and the TTS takes
      WHATIF_NOUVEAU_URL: ${WHATIF_NOUVEAU_URL:-http://127.0.0.1:8005}
      WHATIF_NARRATION_MODEL: ${WHATIF_NARRATION_MODEL:-deepseek/deepseek-v4-flash-0731}
      # renders: "modal" (default) or "local" (needs npm install in the project + a browser)
      WHATIF_RENDER: ${WHATIF_RENDER:-modal}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      WHATIF_MODAL_APP: ${WHATIF_MODAL_APP:-whatif-app-render}
      # ElevenLabs is only used by the SFX step now
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Persist Google Antigravity (agy) OAuth token on disk (/data/.gemini) instead of desktop keyring
      GEMINI_FORCE_FILE_STORAGE: "true"
    volumes:
      - ./data:/data                                   # projects, sqlite, git checkpoints
      - ../what-if-animation:/skill:ro                 # the skill: engine, scripts, references
      - ${HOME}/.modal.toml:/home/node/.modal.toml:ro  # Modal credentials, if not passed as env
      - ${HOME}/.codex:/home/node/.codex               # ChatGPT / Codex OAuth session (auth.json)
      - ${HOME}/.local/bin/agy:/usr/local/bin/agy:ro   # Google Antigravity CLI binary
    shm_size: "1gb"
    restart: unless-stopped
